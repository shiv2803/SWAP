; PlatformIO Project Configuration for SWAP Hindrance Tool
; Build: pio run -e nodea  OR  pio run -e nodeb
; Upload: pio run -e nodea -t upload  OR  pio run -e nodeb -t upload
; Monitor: pio device monitor -e nodea

[env:nodea]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages = 
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.14/esp32-arduino-libs-2.0.14.zip
build_flags = 
  -D NODE_ROLE_A
  -D CORE_DEBUG_LEVEL=0
lib_deps = 
  ; RadioLib for SX1262
  jgromes/RadioLib@^6.5.0
  ; AsyncWebServer for web dashboard
  me-no-dev/ESPAsyncWebServer@^3.1.0
  me-no-dev/AsyncTCP@^1.1.1
  ; ArduinoJson for WebSocket messages
  bblanchon/ArduinoJson@^7.0.4
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600

[env:nodeb]
platform = espressif32
board = esp32dev
framework = arduino
platform_packages = 
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.14/esp32-arduino-libs-2.0.14.zip
build_flags = 
  -D NODE_ROLE_B
  -D CORE_DEBUG_LEVEL=0
lib_deps = 
  jgromes/RadioLib@^6.5.0
  me-no-dev/ESPAsyncWebServer@^3.1.0
  me-no-dev/AsyncTCP@^1.1.1
  bblanchon/ArduinoJson@^7.0.4
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600

; Common settings
[platformio]
default_envs = nodea