<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="The five second protocol trial, with commit on success and rollback on failure">
  <title>Every switch gets a 5-second trial: commit on success, roll back on failure</title>
  <defs>
    <clipPath id="c3"><rect width="900" height="300" rx="16"/></clipPath>
    <clipPath id="barClip"><rect x="150" y="118" width="600" height="26" rx="13"/></clipPath>
    <pattern id="g3" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1c2836" stroke-width="1"/>
    </pattern>
    <style>
      /* 16s loop: 0-8s a trial that SUCCEEDS, 8-16s one that FAILS and rolls back */
      .fill   { animation: fill 16s linear infinite; }
      .head   { animation: head 16s linear infinite; }
      .okBar  { opacity: 0; animation: okBar 16s steps(1) infinite; }
      .badBar { opacity: 0; animation: badBar 16s steps(1) infinite; }

      .stepCmd   { opacity: .3; animation: stepCmd 16s steps(1) infinite; }
      .stepTrial { opacity: .3; animation: stepTrial 16s steps(1) infinite; }
      .stepOk    { opacity: 0;  animation: stepOk 16s steps(1) infinite; }
      .stepBad   { opacity: 0;  animation: stepBad 16s steps(1) infinite; }

      .verdictOk  { opacity: 0; animation: vOk 16s steps(1) infinite; }
      .verdictBad { opacity: 0; animation: vBad 16s steps(1) infinite; }
      .lockOn     { animation: lock 16s steps(1) infinite; }

      @keyframes fill  { 0% { width: 0 } 31.25% { width: 600px } 43.75% { width: 600px }
                         50% { width: 0 } 81.25% { width: 600px } 93.75% { width: 600px } 100% { width: 0 } }
      @keyframes head  { 0% { transform: translateX(0) } 31.25% { transform: translateX(600px) }
                         43.75% { transform: translateX(600px) } 50% { transform: translateX(0) }
                         81.25% { transform: translateX(600px) } 93.75% { transform: translateX(600px) }
                         100% { transform: translateX(0) } }
      @keyframes okBar   { 0%,30% { opacity: 0 } 31.25%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes badBar  { 0%,80% { opacity: 0 } 81.25%,99% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes stepCmd { 0%,4% { opacity: 1 } 6%,50% { opacity: .3 } 50%,54% { opacity: 1 } 56%,100% { opacity: .3 } }
      @keyframes stepTrial { 0%,3% { opacity: .3 } 5%,31% { opacity: 1 } 32%,50% { opacity: .3 }
                             53%,81% { opacity: 1 } 82%,100% { opacity: .3 } }
      @keyframes stepOk  { 0%,31% { opacity: 0 } 31.25%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes stepBad { 0%,81% { opacity: 0 } 81.25%,99% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes vOk     { 0%,31% { opacity: 0 } 31.25%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes vBad    { 0%,81% { opacity: 0 } 81.25%,99% { opacity: 1 } 100% { opacity: 0 } }
      @keyframes lock    { 0%,31% { opacity: 1 } 31.25%,50% { opacity: .25 } 50%,81% { opacity: 1 } 81.25%,100% { opacity: .25 } }

      @media (prefers-reduced-motion: reduce) {
        .fill, .head, .okBar, .badBar, .stepCmd, .stepTrial, .stepOk, .stepBad, .verdictOk, .verdictBad, .lockOn { animation: none }
        .fill { width: 600px } .stepCmd, .stepTrial { opacity: 1 } .verdictOk, .stepOk, .okBar { opacity: 1 }
      }
    </style>
  </defs>

  <g clip-path="url(#c3)">
    <rect width="900" height="300" fill="#0b0f14"/>
    <rect width="900" height="300" fill="url(#g3)" opacity=".55"/>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="1.6">
      <text x="40" y="46" font-size="12.5" fill="#8b98a5">EVERY SWITCH GETS A 5-SECOND TRIAL</text>
      <text x="40" y="70" font-size="11" fill="#5f6b7a">SUCCESS COMMITS THE NEW PROTOCOL &#183; FAILURE ROLLS BACK TO THE PREVIOUS ONE</text>

      <!-- step chips -->
      <g font-size="10.5">
        <g class="stepCmd">
          <rect x="40" y="94" width="96" height="74" rx="10" fill="#8fb6ff" fill-opacity=".12" stroke="#8fb6ff" stroke-opacity=".5"/>
          <text x="88" y="124" text-anchor="middle" fill="#8fb6ff">COMMAND</text>
          <text x="88" y="142" text-anchor="middle" fill="#8b98a5" font-size="9">UNO Q &#8594; A &#8594; B</text>
        </g>
        <g class="stepOk">
          <rect x="764" y="94" width="96" height="74" rx="10" fill="#7fe7c4" fill-opacity=".14" stroke="#7fe7c4" stroke-opacity=".6"/>
          <text x="812" y="124" text-anchor="middle" fill="#7fe7c4">COMMIT</text>
          <text x="812" y="142" text-anchor="middle" fill="#8b98a5" font-size="9">NEW = ACTIVE</text>
        </g>
        <g class="stepBad">
          <rect x="764" y="94" width="96" height="74" rx="10" fill="#ff7b72" fill-opacity=".14" stroke="#ff7b72" stroke-opacity=".6"/>
          <text x="812" y="124" text-anchor="middle" fill="#ff7b72">ROLLBACK</text>
          <text x="812" y="142" text-anchor="middle" fill="#8b98a5" font-size="9">PREVIOUS</text>
        </g>
      </g>
    </g>

    <!-- the trial bar -->
    <rect x="150" y="118" width="600" height="26" rx="13" fill="#111820" stroke="#233041"/>
    <g clip-path="url(#barClip)">
      <rect class="fill" x="150" y="118" width="0" height="26" fill="#8fb6ff" fill-opacity=".30"/>
      <rect class="okBar"  x="150" y="118" width="600" height="26" fill="#7fe7c4" fill-opacity=".26"/>
      <rect class="badBar" x="150" y="118" width="600" height="26" fill="#ff7b72" fill-opacity=".22"/>
    </g>
    <g class="head">
      <line x1="150" y1="110" x2="150" y2="152" stroke="#e6edf3" stroke-width="2"/>
      <circle cx="150" cy="131" r="4.5" fill="#e6edf3"/>
    </g>

    <!-- tick marks -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#5f6b7a">
      <line x1="270" y1="150" x2="270" y2="160" stroke="#233041"/><text x="270" y="174" text-anchor="middle">1s</text>
      <line x1="390" y1="150" x2="390" y2="160" stroke="#233041"/><text x="390" y="174" text-anchor="middle">2s</text>
      <line x1="510" y1="150" x2="510" y2="160" stroke="#233041"/><text x="510" y="174" text-anchor="middle">3s</text>
      <line x1="630" y1="150" x2="630" y2="160" stroke="#233041"/><text x="630" y="174" text-anchor="middle">4s</text>
      <line x1="750" y1="150" x2="750" y2="160" stroke="#233041"/><text x="750" y="174" text-anchor="middle">5s</text>
    </g>
    <g class="stepTrial">
      <text x="450" y="108" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="10.5" letter-spacing="1.6" fill="#8fb6ff">TRIALING &#8212; NODES VALIDATING THE NEW LINK</text>
    </g>

    <!-- verdict line -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.2">
      <rect x="40" y="206" width="820" height="34" rx="9" fill="#111820" stroke="#1c2836"/>
      <text class="verdictOk"  x="60" y="228" fill="#7fe7c4">switch_result: SUCCESS &#8212; trial protocol becomes active, previous kept as the rollback target</text>
      <text class="verdictBad" x="60" y="228" fill="#ff7b72">switch_result: FAILED &#8212; both nodes revert to previousProtocol, which is not always LoRa</text>
    </g>

    <!-- command lock -->
    <g class="lockOn" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.4">
      <rect x="40" y="252" width="360" height="28" rx="8" fill="#f4b860" fill-opacity=".10" stroke="#f4b860" stroke-opacity=".45"/>
      <text x="58" y="271" fill="#f4b860">COMMAND LOCK &#183; NO SECOND SWITCH IN FLIGHT</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.4">
      <text x="424" y="271" fill="#5f6b7a">ONE TRANSITION AT A TIME &#8212; NO OVERLAPPING TRIALS, NO STATE RACES</text>
    </g>
  </g>
</svg>
